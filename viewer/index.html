<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAKUDEN 2027 Frame V4</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#eef1f4;font-family:"Noto Sans JP",system-ui,sans-serif;overflow:hidden}
model-viewer{width:100%;height:100%;--poster-color:transparent;background:radial-gradient(ellipse at 50% 40%,#ffffff 0%,#e9edf1 60%,#dde2e8 100%)}
.tag{position:absolute;left:14px;top:12px;font-size:12px;letter-spacing:.18em;color:#475569;font-weight:700;pointer-events:none}
.tag b{color:#ff6b00}
.hint{position:absolute;right:14px;bottom:10px;font-size:11px;color:#64748b;pointer-events:none}
.legend{position:absolute;left:14px;bottom:10px;display:flex;gap:12px;font-size:11px;color:#475569;pointer-events:none}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.bar{position:absolute;left:0;top:0;height:3px;background:#ff6b00;width:0;transition:width .2s}
</style>
</head>
<body>
<model-viewer id="mv" src="frame-v4.glb" alt="TAKUDEN 2027 車両フレーム V4 の3Dモデル"
  camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="0" rotation-per-second="18deg"
  interaction-prompt="none" shadow-intensity="1" shadow-softness="0.8" exposure="1.05"
  environment-image="neutral" camera-orbit="40deg 72deg auto" field-of-view="28deg"
  min-camera-orbit="auto 10deg auto" max-camera-orbit="auto 95deg auto">
  <div class="bar" slot="progress-bar" id="bar"></div>
</model-viewer>
<div class="tag">2027 FRAME <b>V4</b></div>
<div class="legend"><span><i style="background:#ff6b00"></i>フレーム</span><span><i style="background:#464a50"></i>サスペンション</span></div>
<div class="hint">ドラッグで回転・ピンチで拡大</div>
<script>
const mv=document.getElementById('mv'),bar=document.getElementById('bar');
mv.addEventListener('progress',e=>{const p=e.detail.totalProgress;bar.style.width=(p*100)+'%';if(p>=1)setTimeout(()=>bar.style.opacity=0,300);});
</script>
</body>
</html>
